services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: stocklens
      POSTGRES_USER: stocklens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["stocklens_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocklens -d stocklens"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  stocklens_pg:
